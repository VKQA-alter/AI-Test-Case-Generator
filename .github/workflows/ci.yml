name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./nextjs
        run: npm ci
      - name: Run tests
        working-directory: ./nextjs
        run: npm test --silent
      - name: Build
        working-directory: ./nextjs
        run: npm run build --if-present
