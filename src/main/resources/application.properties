# AI Test Case Generator Configuration

# ============================================
# LOCAL LLM CONFIGURATION (Default - Ollama)
# ============================================
llm.api.url=http://localhost:11434/api/generate
llm.model=llama2

# ============================================
# OPENAI GPT CONFIGURATION
# ============================================
# Uncomment and configure for OpenAI GPT:
# llm.api.url=https://api.openai.com/v1/chat/completions
# llm.model=gpt-4
# llm.api.key=your-api-key-here
#
# For GPT-3.5-turbo (faster, cheaper):
# llm.model=gpt-3.5-turbo
#
# For GPT-4 (better quality):
# llm.model=gpt-4

# ============================================
# OTHER LLM CONFIGURATION OPTIONS
# ============================================
# For LM Studio (OpenAI-compatible):
# llm.api.url=http://localhost:1234/v1/completions
# llm.model=local-model

# For LocalAI:
# llm.api.url=http://localhost:8080/v1/completions
# llm.model=your-model-name

# For Azure OpenAI:
# llm.api.url=https://your-resource.openai.azure.com/openai/deployments/your-deployment/chat/completions?api-version=2023-05-15
# llm.model=gpt-4
# llm.api.key=your-azure-api-key

# File Paths
input.file.path=input/requirements.txt
output.file.path=output/testcases.xlsx

# Application Settings
app.version=1.0.0
app.name=AI Test Case Generator
